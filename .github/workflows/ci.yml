name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore JlptTrainer.sln
      - run: dotnet build JlptTrainer.sln --configuration Release --no-restore
      - run: dotnet test JlptTrainer.sln --configuration Release --no-build
